name: python-ci

on:
  push:
  pull_request:

jobs:
  lint-and-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check scripts

      - name: Syntax check
        run: python -m compileall scripts
